publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  provider: ^6.1.5
  shared_preferences: ^2.3.5
  google_fonts: ^8.0.2
  intl: ^0.20.2
